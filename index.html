<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Maison Miellune — Douceurs artisanales du monde</title>
		<meta
			name="description"
			content="Maison Miellune, atelier de douceurs artisanales inspirées des traditions du monde entier : pâtisseries, gâteaux, pains au levain et gourmandises voyageuses."
		/>

		<!-- PWA -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#e9a94b" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#241812" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Miellune" />

		<!-- Icons -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

		<!-- Social -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Maison Miellune — Douceurs artisanales du monde" />
		<meta
			property="og:description"
			content="Un atelier imaginaire de gourmandises inspirées des traditions du monde entier."
		/>

		<style>
			/* Pre-hydration splash so first paint is never blank. */
			#app-splash {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.25rem;
				background: #fbf6ec;
				color: #7a5a34;
				font-family: ui-sans-serif, system-ui, sans-serif;
				z-index: 60;
				transition: opacity 0.5s ease;
			}
			@media (prefers-color-scheme: dark) {
				#app-splash {
					background: #241812;
					color: #e9c99b;
				}
			}
			#app-splash .splash-mark {
				width: 68px;
				height: 68px;
				animation: splash-bob 1.6s ease-in-out infinite;
			}
			#app-splash .splash-word {
				font-family: ui-serif, Georgia, "Times New Roman", serif;
				letter-spacing: 0.28em;
				text-transform: uppercase;
				font-size: 0.8rem;
			}
			@keyframes splash-bob {
				0%, 100% { transform: translateY(0) rotate(-3deg); }
				50% { transform: translateY(-8px) rotate(3deg); }
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<div id="app-splash" aria-hidden="true">
			<svg class="splash-mark" viewBox="0 0 64 64" aria-hidden="true">
				<path
					fill="currentColor"
					fill-rule="evenodd"
					d="M14.5 31.5 a17.5 17.5 0 1 0 35 0 a17.5 17.5 0 1 0 -35 0 Z
					   M23.75 28.75 a15.75 15.75 0 1 1 31.5 0 a15.75 15.75 0 1 1 -31.5 0 Z"
				/>
				<path
					fill="currentColor"
					d="M35 18.75 C35 18.75 42.5 29 42.5 35 a7.25 7.25 0 1 1 -14.5 0 C28 29 35 18.75 35 18.75 Z"
				/>
			</svg>
			<div class="splash-word">Maison Miellune</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
