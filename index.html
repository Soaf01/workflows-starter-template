<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
		/>
		<title>Bakehouse — Order · Classes · Catering</title>
		<meta name="description" content="A white-label bakehouse ordering app — menu, classes, catering, gift cards and more." />

		<!-- PWA -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0e0b08" />
		<meta name="color-scheme" content="dark" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<style>
			#app-splash {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.5rem;
				background: #0e0b08;
				z-index: 60;
				transition: opacity 0.5s ease;
			}
			#app-splash .ring {
				width: 46px;
				height: 46px;
				border-radius: 50%;
				border: 2px solid rgba(217, 178, 106, 0.2);
				border-top-color: #d9b26a;
				animation: spin 0.9s linear infinite;
			}
			#app-splash .word {
				font-family: Georgia, "Times New Roman", serif;
				color: #d9b26a;
				letter-spacing: 0.4em;
				text-transform: uppercase;
				font-size: 0.72rem;
				padding-left: 0.4em;
			}
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<div id="app-splash" aria-hidden="true">
			<div class="ring"></div>
			<div class="word">Bakehouse</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
